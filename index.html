<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>最适合你的职业测试</title>
<style>
  :root {
    --bg: #F7F5F1;
    --card: #FFFFFF;
    --ink: #1C1B18;
    --ink-2: #6E6A62;
    --ink-3: #A8A399;
    --accent: #9A7B4F;
    --accent-soft: #F1E9DD;
    --line: #E8E4DC;
    --serif: "Noto Serif SC", "Songti SC", "STSong", "SimSun", serif;
    --sans: -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; }
  body {
    background: var(--bg);
    color: var(--ink);
    font-family: var(--sans);
    font-size: 16px;
    line-height: 1.7;
    display: flex;
    justify-content: center;
  }
  .app {
    width: 100%;
    max-width: 480px;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    background: var(--bg);
    position: relative;
  }
  .page { flex: 1; display: flex; flex-direction: column; animation: fadein .45s ease; }
  .page.hidden { display: none; }
  @keyframes fadein { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }
  @keyframes fadeout { from { opacity: 1; } to { opacity: 0; transform: translateY(-8px); } }

  /* ===== 首页 ===== */
  #page-intro { justify-content: center; padding: 48px 32px; }
  .intro-eyebrow {
    font-size: 12px; letter-spacing: .35em; color: var(--accent);
    text-transform: uppercase; margin-bottom: 22px;
  }
  .intro-title {
    font-family: var(--serif); font-weight: 600;
    font-size: 40px; line-height: 1.3; letter-spacing: .04em;
    margin-bottom: 18px;
  }
  .intro-title .accent { color: var(--accent); }
  .intro-divider { width: 44px; height: 1px; background: var(--accent); margin: 26px 0; opacity: .7; }
  .intro-desc { color: var(--ink-2); font-size: 15px; margin-bottom: 10px; }
  .intro-meta { margin: 30px 0 40px; display: flex; gap: 12px; flex-wrap: wrap; }
  .meta-chip {
    font-size: 12.5px; color: var(--ink-2);
    border: 1px solid var(--line); border-radius: 999px;
    padding: 6px 14px; background: var(--card);
  }
  .btn-main {
    display: block; width: 100%; padding: 17px;
    background: var(--ink); color: #fff;
    border: none; border-radius: 4px;
    font-size: 16px; letter-spacing: .3em; text-indent: .3em;
    cursor: pointer; transition: opacity .2s, transform .15s;
  }
  .btn-main:active { transform: scale(.98); opacity: .9; }
  .intro-foot { margin-top: 18px; text-align: center; font-size: 12px; color: var(--ink-3); }

  /* ===== 答题页 ===== */
  .progress-wrap { padding: 0 32px; margin-top: 28px; }
  .progress-text { display: flex; justify-content: space-between; font-size: 12px; color: var(--ink-3); margin-bottom: 10px; letter-spacing: .1em; }
  .progress-track { height: 2px; background: var(--line); border-radius: 2px; overflow: hidden; }
  .progress-bar { height: 100%; width: 0%; background: var(--accent); transition: width .4s ease; }
  .q-area { flex: 1; display: flex; flex-direction: column; justify-content: center; padding: 28px 32px 20px; }
  .q-num { font-family: var(--serif); font-size: 14px; color: var(--accent); letter-spacing: .25em; margin-bottom: 12px; }
  .q-title { font-family: var(--serif); font-size: 23px; font-weight: 600; line-height: 1.55; margin-bottom: 30px; }
  .opts { display: flex; flex-direction: column; gap: 12px; }
  .opt {
    background: var(--card); border: 1px solid var(--line);
    border-radius: 6px; padding: 16px 18px;
    font-size: 15px; color: var(--ink);
    cursor: pointer; transition: border-color .2s, background .2s, transform .12s;
    display: flex; align-items: baseline; gap: 12px;
  }
  .opt:active { transform: scale(.985); }
  .opt:hover { border-color: var(--accent); }
  .opt.picked { border-color: var(--accent); background: var(--accent-soft); }
  .opt-key {
    font-family: var(--serif); color: var(--accent);
    font-size: 14px; min-width: 14px; flex-shrink: 0;
  }
  .q-nav { display: flex; justify-content: space-between; align-items: center; padding: 0 32px 34px; }
  .btn-ghost {
    background: none; border: none; color: var(--ink-3);
    font-size: 14px; letter-spacing: .15em; cursor: pointer;
    padding: 8px 0; font-family: var(--sans);
  }
  .btn-ghost:disabled { opacity: .3; cursor: default; }
  .q-hint { font-size: 12px; color: var(--ink-3); letter-spacing: .1em; }

  /* ===== 结果页 ===== */
  #page-result { padding: 44px 28px 56px; }
  .res-eyebrow { font-size: 12px; letter-spacing: .35em; color: var(--accent); margin-bottom: 14px; }
  .res-title { font-family: var(--serif); font-size: 30px; font-weight: 600; line-height: 1.4; margin-bottom: 8px; }
  .res-sub { color: var(--ink-2); font-size: 14px; margin-bottom: 30px; }
  .card {
    background: var(--card); border: 1px solid var(--line);
    border-radius: 8px; padding: 24px 22px; margin-bottom: 18px;
  }
  .card-label { font-size: 12px; letter-spacing: .3em; color: var(--accent); margin-bottom: 16px; }
  .radar-box { display: flex; justify-content: center; margin-bottom: 6px; }
  .bar-list { margin-top: 12px; display: flex; flex-direction: column; gap: 13px; }
  .bar-row { display: flex; align-items: center; gap: 12px; }
  .bar-name { width: 74px; font-size: 13px; color: var(--ink); flex-shrink: 0; }
  .bar-name span { color: var(--ink-3); font-size: 11px; display: block; letter-spacing: .05em; }
  .bar-track { flex: 1; height: 6px; background: var(--line); border-radius: 3px; overflow: hidden; }
  .bar-fill { height: 100%; background: var(--accent); border-radius: 3px; width: 0; transition: width 1s ease; }
  .bar-pct { width: 42px; text-align: right; font-size: 12.5px; color: var(--ink-2); font-variant-numeric: tabular-nums; }
  .type-tag {
    display: inline-block; font-size: 13px; letter-spacing: .15em;
    color: var(--accent); background: var(--accent-soft);
    border-radius: 999px; padding: 7px 18px; margin-bottom: 16px;
  }
  .type-name { font-family: var(--serif); font-size: 26px; font-weight: 600; margin-bottom: 12px; }
  .type-desc { font-size: 14.5px; color: var(--ink-2); }
  .job-item { display: flex; align-items: baseline; gap: 12px; padding: 13px 0; border-bottom: 1px dashed var(--line); }
  .job-item:last-child { border-bottom: none; padding-bottom: 0; }
  .job-rank { font-family: var(--serif); color: var(--accent); font-size: 15px; flex-shrink: 0; }
  .job-body b { display: block; font-size: 15.5px; font-weight: 600; margin-bottom: 3px; }
  .job-body p { font-size: 13px; color: var(--ink-2); }
  .ana-p { font-size: 14.5px; color: var(--ink-2); margin-bottom: 14px; }
  .ana-p:last-child { margin-bottom: 0; }
  .ana-p strong { color: var(--ink); font-weight: 600; }
  .plan-stage { display: flex; gap: 16px; position: relative; padding-bottom: 26px; }
  .plan-stage:last-child { padding-bottom: 0; }
  .plan-stage::before {
    content: ""; position: absolute; left: 5px; top: 20px; bottom: 4px;
    width: 1px; background: var(--line);
  }
  .plan-stage:last-child::before { display: none; }
  .plan-dot {
    width: 11px; height: 11px; border-radius: 50%;
    background: var(--accent); flex-shrink: 0; margin-top: 7px; position: relative; z-index: 1;
  }
  .plan-body h4 { font-size: 15px; font-weight: 600; margin-bottom: 5px; }
  .plan-body h4 span { font-size: 12px; color: var(--accent); margin-left: 8px; letter-spacing: .1em; font-weight: 400; }
  .plan-body p { font-size: 13.5px; color: var(--ink-2); }
  .btn-restart {
    margin-top: 10px; width: 100%; padding: 16px;
    background: none; border: 1px solid var(--ink);
    border-radius: 4px; color: var(--ink);
    font-size: 15px; letter-spacing: .3em; text-indent: .3em;
    cursor: pointer; font-family: var(--sans); transition: background .2s, color .2s;
  }
  .btn-restart:hover { background: var(--ink); color: #fff; }
  .res-foot { text-align: center; font-size: 11.5px; color: var(--ink-3); margin-top: 26px; line-height: 1.8; }
</style>
</head>
<body>
<div class="app">

  <!-- 首页 -->
  <div class="page" id="page-intro">
    <div class="intro-eyebrow">CAREER PSYCHOMETRIC</div>
    <h1 class="intro-title">最适合你的<br><span class="accent">职业</span>测试</h1>
    <div class="intro-divider"></div>
    <p class="intro-desc">基于霍兰德职业兴趣理论（RIASEC），通过 30 道情境选择题，测量你在六大职业人格维度上的真实倾向，为你匹配最适合的职业方向，并生成专属心理分析与职业规划。</p>
    <div class="intro-meta">
      <span class="meta-chip">30 道精选题目</span>
      <span class="meta-chip">约需 6 分钟</span>
      <span class="meta-chip">六大维度测评</span>
      <span class="meta-chip">专属职业规划</span>
    </div>
    <button class="btn-main" id="btn-start">开始测试</button>
    <p class="intro-foot">请根据第一直觉作答，答案无对错之分</p>
  </div>

  <!-- 答题页 -->
  <div class="page hidden" id="page-quiz">
    <div class="progress-wrap">
      <div class="progress-text"><span id="pg-now">01</span><span id="pg-total">/ 30</span></div>
      <div class="progress-track"><div class="progress-bar" id="pg-bar"></div></div>
    </div>
    <div class="q-area">
      <div class="q-num" id="q-num">QUESTION 01</div>
      <div class="q-title" id="q-title"></div>
      <div class="opts" id="q-opts"></div>
    </div>
    <div class="q-nav">
      <button class="btn-ghost" id="btn-prev">← 上一题</button>
      <span class="q-hint">点击选项自动进入下一题</span>
    </div>
  </div>

  <!-- 结果页 -->
  <div class="page hidden" id="page-result">
    <div class="res-eyebrow">YOUR RESULT</div>
    <h2 class="res-title">你的专属职业报告</h2>
    <p class="res-sub" id="res-sub"></p>
    <div id="res-body"></div>
    <button class="btn-restart" id="btn-restart">重新测试</button>
    <p class="res-foot">本测试基于霍兰德职业兴趣理论（RIASEC）设计<br>结果仅供职业探索参考，不构成唯一决策依据</p>
  </div>

</div>

<script>
/* ============ 维度定义 ============ */
const DIMS = {
  R: { name: "现实型", tag: "实干家", brief: "动手 · 务实 · 技术",
    desc: "你偏好具体、实际、看得见摸得着的任务，乐于使用工具、机械与技能去解决真实问题。你做事踏实，重视结果与效率，是团队中可靠的执行者。",
    careers: [
      ["机械 / 电气 / 土木工程师", "将技术能力转化为可靠的产品与工程成果"],
      ["建筑师与建造管理者", "融合技术与落地能力，把图纸变为现实空间"],
      ["飞行员 / 车辆与设备技术专家", "在高标准操作中发挥精准与沉稳"],
      ["康复治疗师 / 运动健康专家", "以专业技能直接改善他人的身体状态"],
      ["智能制造与高级技工类职业", "技艺精湛的手艺人在智能制造时代价值持续上升"]],
    plan: [
      ["探索期", "0 – 1 年", "广泛接触技术类岗位的真实工作内容，考取 1–2 项硬技能认证（如工程类资格、专业操作证书），通过实习或项目确认自己最擅长的技术领域。"],
      ["深耕期", "1 – 3 年", "选定一个细分技术方向深耕，刻意积累完整的项目经历，从「会做」走向「做得精」，同时补齐工程沟通与文档表达能力。"],
      ["突破期", "3 – 10 年", "向技术专家或技术管理双通道发展：成为领域内被信赖的技术权威，或带领团队交付大型项目，让你的技艺产生更大杠杆效应。"]],
    blind: "你可能偏重「把事做完」，而低估了表达、协调与长远规划的价值——有意识地补足这些软技能，会让你的硬实力被更多人看见。"},

  I: { name: "研究型", tag: "思考者", brief: "分析 · 求知 · 深度",
    desc: "你天生好奇，享受观察、分析与推理的过程，喜欢探索复杂问题背后的规律。你独立、理性，对「搞懂一件事」的渴望常常超过对即时回报的关注。",
    careers: [
      ["科研人员 / 高校研究者", "在未知的边界上持续探索与发现"],
      ["数据科学家 / 算法工程师", "用模型与逻辑从数据中提炼洞察"],
      ["医生与临床医学研究者", "将严谨思维用于诊断与攻克疾病"],
      ["精算师 / 量化分析师", "以数学建模应对复杂的不确定性"],
      ["行业研究员 / 战略分析师", "深度研究驱动商业与政策判断"]],
    plan: [
      ["探索期", "0 – 1 年", "确定 1–2 个真正让你着迷的研究主题，系统补强方法论（统计、编程、实验设计），尝试产出第一份独立完成的研究或分析报告。"],
      ["深耕期", "1 – 3 年", "进入能提供真实研究环境的平台（高校、实验室、研究院、数据团队），围绕单一方向持续产出，建立你在该领域的知识体系与作品集。"],
      ["突破期", "3 – 10 年", "争取代表性成果（论文、专利、关键模型或行业报告），从执行研究者成长为课题主导者，逐步建立学术或行业影响力。"]],
    blind: "你容易追求完美分析而延迟行动，也可能低估与人协作、表达与「推销」想法的重要性——记住，洞见只有被传播才有价值。"},

  A: { name: "艺术型", tag: "创造者", brief: "审美 · 灵感 · 表达",
    desc: "你敏感、独立、富有想象力，渴望通过独特的方式表达内心世界。你不喜欢单调与束缚，审美与原创性是你评价世界的底层标准。",
    careers: [
      ["UI / 平面 / 空间设计师", "用视觉语言解决问题、传递体验"],
      ["文案策划与内容创作者", "以文字与故事打动人心、建立共鸣"],
      ["影视 / 音视频创作与剪辑", "用镜头与节奏讲述打动人的作品"],
      ["插画师 / 独立艺术家 / 音乐人", "建立个人风格与原创作品体系"],
      ["品牌与产品体验设计师", "在商业约束中寻找美的最优解"]],
    plan: [
      ["探索期", "0 – 1 年", "大量尝试不同媒介与风格，建立个人作品集雏形；确定你最想深耕的表达领域，并研究该领域优秀者的成长路径。"],
      ["深耕期", "1 – 3 年", "持续公开输出作品，形成可辨识的个人风格；接真实项目磨炼「带着约束创作」的能力，让审美与商业需求达成平衡。"],
      ["突破期", "3 – 10 年", "打造代表作与个人品牌，争取行业奖项或现象级作品；从接单者升级为风格主导者，用作品定义你的职业身份。"]],
    blind: "你可能在自由与纪律之间摇摆——为创作建立稳定的节奏与 deadline 意识，同时学习基本的商业沟通，会让才华走得更远。"},

  S: { name: "社会型", tag: "助人者", brief: "共情 · 服务 · 联结",

    careers: [
      ["教师 / 教育培训专家", "见证并推动一个个具体的人成长"],
      ["心理咨询师 / 生涯规划师", "以专业助人能力陪伴他人穿越困境"],
      ["人力资源与组织发展专家", "让对的人在合适的岗位上发光"],
      ["医护与康复服务从业者", "在最需要关怀的场景里提供专业照护"],
      ["公益与社会工作者", "为弱势群体与公共福祉持续奔走"]],
    plan: [
      ["探索期", "0 – 1 年", "通过志愿服务、支教、社群运营等真实助人场景验证热情；确定你最想服务的对象（孩子、患者、职场人等），并补齐相关基础资质。"],
      ["深耕期", "1 – 3 年", "进入目标领域积累一线经验，考取执业资格（教师资格、心理咨询、人力资源认证等），形成自己的助人方法论。"],
      ["突破期", "3 – 10 年", "从服务个体走向影响系统：设计课程与项目、带团队、建设服务体系，把个人善意放大为可复制的组织能力。"]],
    blind: "你可能习惯把别人的需求放在前面而忽略自身边界——学会设置健康的界限、发展自己的专业权威感，助人才能可持续。"},

  E: { name: "企业型", tag: "领导者", brief: "进取 · 说服 · 开创",

    careers: [

      ["创业者 / 业务开拓负责人", "在不确定性中发现并抓住机会"],

    plan: [

      ["深耕期", "1 – 3 年", "聚焦一个行业吃透其商业逻辑，做出可量化的业绩（增长、营收、项目交付），积累你的第一个「拿得出手的战绩」与行业人脉。"],
      ["突破期", "3 – 10 年", "选择更大平台的管理岗或独立创业，组建自己的团队与资源网络；从个人贡献者转型为业绩与团队的「双重负责人」。"]],
    blind: "你的果断是优势，也可能变成冒进——刻意练习倾听与复盘，学会在推动目标的同时照顾人的感受，领导力会更完整。"},

  C: { name: "常规型", tag: "组织者", brief: "严谨 · 秩序 · 可靠",
    desc: "你细致、有条理、责任感强，享受把复杂事务安排得井井有条的确定感。你重视规则与质量，是让系统稳定运转、让人放心的关键角色。",
    careers: [
      ["会计师 / 审计师", "以严谨守护组织财务的真实与合规"],
      ["供应链与运营管理专家", "让复杂系统的每个环节精确衔接"],
      ["银行 / 信贷 / 风控专员", "在规范体系内做出稳健可靠的判断"],
      ["行政与项目管理专家", "成为团队高效运转的隐形引擎"],
      ["质量与合规管理 / 数据管理岗", "以标准与细节筑起组织的安全底线"]],
    plan: [
      ["探索期", "0 – 1 年", "选定一个规范度高的职能入口（财务、运营、行政、风控），考取入门资质（如初级会计、项目管理认证），建立标准化工作习惯。"],
      ["深耕期", "1 – 3 年", "在核心流程中承担关键职责，用工具与数据提升流程效率；从「执行规则」进阶到「理解规则背后的业务逻辑」。"],
      ["突破期", "3 – 10 年", "考取高阶资质（CPA、PMP 等）并走向管理岗位，负责体系设计与流程优化——从秩序的维护者成长为规则的设计者。"]],
    blind: "你对秩序的热爱可能让你回避变化与冒险——定期给自己安排「走出舒适区」的小挑战，灵活性和视野会为你打开新的上升空间。"}
};

/* ============ 30 道题目（选项 d 为维度） ============ */
const QUESTIONS = [
  { q:"周末空闲时，你最可能选择做什么？", o:[["亲手做点东西，或修理一件物品","R"],["钻研一个让你着迷的问题","I"],["写写画画，搞点创作","A"],["组织聚会，和大家聊聊天","S"]] },
  { q:"在一个团队里，你自然而然扮演的角色往往是？", o:[["出主意、想点子的人","A"],["协调关系、照顾大家情绪的人","S"],["带头冲、推动目标达成的人","E"],["把控流程和细节的人","C"]] },
  { q:"面对一个复杂的实际问题，你通常会？", o:[["直接上手，边做边试","R"],["先分析清楚原理和逻辑","I"],["果断拍板，干起来再调整","E"],["列好清单，按步骤推进","C"]] },
  { q:"你更容易被哪一类内容吸引？", o:[["科学发现与前沿技术","I"],["设计、艺术与好故事","A"],["商业案例与创业故事","E"],["人物访谈与真实的情感故事","S"]] },
  { q:"你做事的风格更接近哪一种？", o:[["边做边改，手感优先","R"],["跟着审美和直觉走","A"],["先看人和氛围，再决定怎么行动","S"],["一切按计划和规则来","C"]] },
  { q:"朋友遇到难题向你求助，你通常会？", o:[["直接动手帮他解决","R"],["帮他把问题拆解分析清楚","I"],["陪着他，给他打气","S"],["帮他争取资源、牵线搭桥","E"]] },
  { q:"学生时代，你最喜欢哪一类课？", o:[["数学、物理、科学类","I"],["语文、美术、音乐类","A"],["演讲、辩论、商赛类","E"],["整理资料、统计分析类","C"]] },
  { q:"去一个陌生城市旅行，你更喜欢？", o:[["徒步、登山等户外体验","R"],["艺术街区、音乐会、摄影","A"],["说走就走、充满挑战的行程","E"],["结识当地人、深入交流","S"]] },
  { q:"你的桌面或房间通常是？", o:[["摆满工具和材料，随时能用","R"],["堆满书和资料","I"],["温馨，有自己布置的人情味","S"],["整洁分类，一切归位","C"]] },
  { q:"面对紧急的截止日期，你的策略是？", o:[["先干起来，越快越好","R"],["拉上同伴一起赶工","S"],["冲刺一把，最后一搏","E"],["提前列好计划，稳步推进","C"]] },
  { q:"朋友眼中，你更擅长哪件事？", o:[["把复杂的事情讲明白","I"],["幽默表达，活跃气氛","A"],["倾听并给出暖心的建议","S"],["把生活安排得井井有条","C"]] },
  { q:"你更欣赏哪一种类型的人？", o:[["技艺高超的工匠","R"],["洞察本质的科学家","I"],["才华横溢的艺术家","A"],["有感染力的企业家","E"]] },
  { q:"团队内部出现分歧时，你倾向于？", o:[["先照顾各方的感受","S"],["果断拍板，承担后果","E"],["用有创意的方式化解僵局","A"],["按制度和惯例来处理","C"]] },
  { q:"对于重复性的工作，你的态度是？", o:[["只要能做出实际的成果，重复也不怕","R"],["讨厌重复，更喜欢新问题","I"],["更在意它能带来多少回报","E"],["有条理的重复反而让我安心","C"]] },
  { q:"你理想中的职业成就感来自？", o:[["做出看得见摸得着的成果","R"],["攻克一个没人解决的问题","I"],["作品被欣赏和传播","A"],["帮助的人成长与感谢","S"]] },
  { q:"认识新朋友后，你更容易记住他的？", o:[["有趣的观点","I"],["带给你的感觉","S"],["身份、背景与人脉","E"],["生日、习惯这类细节","C"]] },
  { q:"如果能长期坚持一件事，你最可能坚持？", o:[["运动、健身或动手的爱好","R"],["乐器、绘画或写作","A"],["投入一段友谊或一个社群","S"],["记账、写手账、整理收纳","C"]] },
  { q:"你如何看待职业上的风险？", o:[["愿意放手一搏，抓住机会","E"],["评估清楚数据和概率再决定","I"],["风险里往往藏着灵感和可能","A"],["更相信一技之长傍身","R"]] },
  { q:"你眼中的「影响力」更接近？", o:[["做出实用的产品与工程","R"],["提出改变他人认知的洞见","I"],["让身边的人过得更好","S"],["赢得话语权，带领团队","E"]] },
  { q:"回忆一次聚会，你更容易记住？", o:[["聊到的有趣话题","I"],["现场的音乐和布置","A"],["和谁聊得特别投机","S"],["时间地点安排得是否妥当","C"]] },
  { q:"如果几份工作年薪相同，你会选？", o:[["技术工种，每天动手做出东西","R"],["自由创作者，每天创作","A"],["管理岗位，每天与人打交道","E"],["流程化岗位，按部就班","C"]] },
  { q:"看到一套新规则或新流程，你的第一反应是？", o:[["想试试它在实际中怎么用","R"],["分析它背后的逻辑","I"],["关心它对大家的影响","S"],["逐条记住并严格执行","C"]] },
  { q:"别人最常夸你的点是？", o:[["想法有深度、聪明","I"],["有品味、有创意","A"],["亲和、值得信任","S"],["有魄力、敢担当","E"]] },
  { q:"你理想的工作环境是？", o:[["现场、车间、户外","R"],["工作室、创意园区","A"],["节奏快、机会多的平台","E"],["稳定规范的大机构","C"]] },
  { q:"面对一张空白的文档或画布，你会？", o:[["想先深入研究一个主题","I"],["让灵感自由流淌","A"],["想写点能创造价值的东西","E"],["先列好提纲和框架","C"]] },
  { q:"在社交场合，你更擅长？", o:[["在共同做事中自然建立关系","R"],["一对一的深度交流","S"],["结识优秀的人、拓展圈子","E"],["记住每个人的名字和喜好","C"]] },
  { q:"你更愿意在哪种团队里工作？", o:[["小而精的实干团队","R"],["爱研究、爱讨论的团队","I"],["自由开放的创意团队","A"],["温暖互助的团队","S"]] },
  { q:"三十年后，你希望别人这样记住你：", o:[["他留下了美的东西","A"],["他温暖和改变了许多人","S"],["他干成了一番事业","E"],["他把一切打理得妥妥当当","C"]] },
  { q:"你认为一份好工作的首要标准是？", o:[["能施展动手与专业技艺","R"],["能持续学习和思考","I"],["能与人建立有意义的联结","S"],["收入稳定、有保障","C"]] },
  { q:"做重要决定时，你更依赖？", o:[["实践经验和常识","R"],["数据和逻辑","I"],["直觉和感觉","A"],["对机会与回报的判断","E"]] }
];

/* ============ 状态 ============ */
let current = 0;
let answers = new Array(QUESTIONS.length).fill(null);

/* ============ 元素 ============ */
const $ = id => document.getElementById(id);
const pages = { intro: $("page-intro"), quiz: $("page-quiz"), result: $("page-result") };

function showPage(key) {
  Object.values(pages).forEach(p => p.classList.add("hidden"));
  pages[key].classList.remove("hidden");
  window.scrollTo(0, 0);
}

/* ============ 答题逻辑 ============ */
function renderQuestion() {
  const item = QUESTIONS[current];
  $("q-num").textContent = "QUESTION " + String(current + 1).padStart(2, "0");
  $("pg-now").textContent = String(current + 1).padStart(2, "0");
  $("pg-bar").style.width = (current / QUESTIONS.length * 100) + "%";
  $("q-title").textContent = item.q;

  const box = $("q-opts");
  box.innerHTML = "";
  item.o.forEach((opt, i) => {
    const div = document.createElement("div");
    div.className = "opt" + (answers[current] === i ? " picked" : "");
    div.innerHTML = '<span class="opt-key">' + "ABCD"[i] + '</span><span>' + opt[0] + "</span>";
    div.onclick = () => {
      answers[current] = i;
      box.querySelectorAll(".opt").forEach(el => el.classList.remove("picked"));
      div.classList.add("picked");
      setTimeout(() => {
        if (current < QUESTIONS.length - 1) { current++; renderQuestion(); }
        else { showResult(); }
      }, 220);
    };
    box.appendChild(div);
  });
  $("btn-prev").disabled = current === 0;
}

$("btn-prev").onclick = () => {
  if (current > 0) { current--; renderQuestion(); }
};
$("btn-start").onclick = () => {
  current = 0;
  answers = new Array(QUESTIONS.length).fill(null);
  renderQuestion();
  showPage("quiz");
};
$("btn-restart").onclick = () => showPage("intro");

/* ============ 计分与结果 ============ */
function showResult() {
  $("pg-bar").style.width = "100%";
  const scores = { R: 0, I: 0, A: 0, S: 0, E: 0, C: 0 };
  QUESTIONS.forEach((item, i) => {
    if (answers[i] !== null) scores[item.o[answers[i]][1]]++;
  });
  const order = Object.keys(scores).sort((a, b) => scores[b] - scores[a]);
  const main = order[0], second = order[1], third = order[2];
  const dMain = DIMS[main], dSecond = DIMS[second];

  /* --- 雷达图 --- */
  const cx = 150, cy = 140, R0 = 100;
  const pct = k => scores[k] / 20;
  const angle = i => (Math.PI * 2 * i / 6) - Math.PI / 2;
  const pt = (i, r) => [cx + r * Math.cos(angle(i)), cy + r * Math.sin(angle(i))];
  let rings = "";
  [0.25, 0.5, 0.75, 1].forEach(f => {
    const ps = [0,1,2,3,4,5].map(i => pt(i, R0 * f).map(v => v.toFixed(1)).join(",")).join(" ");
    rings += '<polygon points="' + ps + '" fill="none" stroke="#E8E4DC" stroke-width="1"/>';
  });
  let axes = "";
  [0,1,2,3,4,5].forEach(i => {
    const [x, y] = pt(i, R0);
    axes += '<line x1="' + cx + '" y1="' + cy + '" x2="' + x + '" y2="' + y + '" stroke="#E8E4DC" stroke-width="1"/>';
  });
  const dataPts = [0,1,2,3,4,5].map((k, i) => {
    const arr = ["R","I","A","S","E","C"];
    return pt(i, R0 * Math.max(pct(arr[i]), 0.06)).map(v => v.toFixed(1)).join(",");
  }).join(" ");
  let labels = "";
  const dimSeq = ["R","I","A","S","E","C"];
  [0,1,2,3,4,5].forEach(i => {
    const lx = cx + (R0 + 22) * Math.cos(angle(i));
    const ly = cy + (R0 + 22) * Math.sin(angle(i));
    const anchor = Math.abs(lx - cx) < 12 ? "middle" : (lx > cx ? "start" : "end");
    labels += '<text x="' + lx.toFixed(1) + '" y="' + (ly + 4).toFixed(1) + '" text-anchor="' + anchor + '" font-size="12" fill="#6E6A62" font-family="serif">' + DIMS[dimSeq[i]].name + " " + scores[dimSeq[i]] + '</text>';
  });
  const radarSvg =
    '<svg width="300" height="260" viewBox="0 0 300 280">' +
    '<polygon points="' + dataPts + '" fill="rgba(154,123,79,0.18)" stroke="#9A7B4F" stroke-width="1.6" stroke-linejoin="round"/>' +
    rings + axes + labels +
    "</svg>";

  /* --- 维度条 --- */
  let bars = "";
  ["R","I","A","S","E","C"].forEach(k => {
    const p = Math.round(scores[k] / 20 * 100);
    bars += '<div class="bar-row"><div class="bar-name">' + DIMS[k].name + '<span>' + DIMS[k].tag + "</span></div>" +
      '<div class="bar-track"><div class="bar-fill" data-w="' + p + '"></div></div>' +
      '<div class="bar-pct">' + p + "%</div></div>";
  });

  /* --- 职业列表 --- */
  let jobs = "";
  dMain.careers.forEach((c, i) => {
    jobs += '<div class="job-item"><span class="job-rank">0' + (i + 1) + "</span>" +
      '<div class="job-body"><b>' + c[0] + "</b><p>" + c[1] + "</p></div></div>";
  });

  /* --- 心理分析 --- */
  const analysis = [
    "<strong>主导倾向：「" + dMain.name + " · " + dMain.tag + "」。</strong>" + dMain.desc,
    "<strong>次要倾向：「" + dSecond.name + " · " + dSecond.tag + "」。</strong>你的第二维度为职业选择提供了重要的组合优势——" +
      (main + second === "IR" || main + second === "RI" ? "思考与动手兼备，你既能在理论层面吃透问题，也能亲手把它做出来，研究工程复合型人才往往稀缺而抢手。" :
      main + second === "AS" || main + second === "SA" ? "创造力与共情并存，你既能创作打动人的内容，又懂人心，适合所有「以人为本的表达型」职业。" :
      main + second === "ES" || main + second === "SE" ? "进取心与人缘兼备，你推动目标时自带感染力，是天生的团队领袖与服务型管理者。" :
      main + second === "EC" || main + second === "CE" ? "开拓与秩序并存，你既有冲劲又能把底盘做稳，适合管理与运营复合型岗位。" :
      main + second === "IA" || main + second === "AI" ? "理性与感性兼备，你的洞察既有深度又有美感，适合研究、设计交叉的前沿领域。" :
      main + second === "RS" || main + second === "SR" ? "动手能力与助人意愿兼备，适合技能服务型职业，用双手直接帮助他人。" :
      main + second === "RC" || main + second === "CR" ? "实操与条理兼备，你是把事情「做对又做好」的可靠型人才，技术与流程类岗位首选。" :
      main + second === "IC" || main + second === "CI" ? "分析与严谨兼备，你既爱钻研又重规范，数据、审计、研究支持类岗位是绝佳匹配。" :
      main + second === "AE" || main + second === "EA" ? "创意与野心兼备，你既能想出好点子又有胆量推动它变现，创意产业与品牌创业是你的主场。" :
      "两种特质相互补充，让你在「" + dMain.tag + "」底色之上拥有更灵活的职业弹性。"),
    "<strong>需要留意的盲区：</strong>" + dMain.blind,
    "<strong>综合建议：</strong>优先在「" + dMain.name + "」主导的职业轨道上积累核心竞争力，同时有意识地运用「" + dSecond.name + "」的特质形成个人差异化优势——例如在团队中承担与" + dSecond.tag + "特质相关的角色，会让你比同赛道的人更快脱颖而出。"
  ].map(p => '<p class="ana-p">' + p + "</p>").join("");

  /* --- 职业规划 --- */
  const plan = dMain.plan.map(s =>
    '<div class="plan-stage"><div class="plan-dot"></div><div class="plan-body">' +
    "<h4>" + s[0] + "<span>" + s[1] + "</span></h4><p>" + s[2] + "</p></div></div>"
  ).join("");

  $("res-sub").textContent = "基于你的 30 道作答，为你生成的专属职业倾向报告";
  $("res-body").innerHTML =
    '<div class="card"><div class="card-label">DIMENSION PROFILE · 六维画像</div>' +
    '<div class="radar-box">' + radarSvg + "</div>" +
    '<div class="bar-list">' + bars + "</div></div>" +

    '<div class="card"><div class="card-label">PRIMARY TYPE · 主导职业人格</div>' +
    '<span class="type-tag">' + dMain.tag + " · " + main + " 型</span>" +
    '<div class="type-name">' + dMain.name + "</div>" +
    '<p class="type-desc">' + dMain.desc + "</p></div>" +

    '<div class="card"><div class="card-label">CAREER MATCH · 推荐职业方向</div>' + jobs + "</div>" +

    '<div class="card"><div class="card-label">PSYCHOLOGICAL ANALYSIS · 心理分析</div>' + analysis + "</div>" +

    '<div class="card"><div class="card-label">CAREER PLAN · 三阶段职业规划</div>' + plan + "</div>";

  showPage("result");
  setTimeout(() => {
    document.querySelectorAll(".bar-fill").forEach(el => el.style.width = el.dataset.w + "%");
  }, 150);
}
</script>
</body>
